[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qplay"
version = "0.1.0"
description = "A physics and maths playground: simulations, symbolic maths and notebooks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "sympy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest", "jupyterlab", "ipykernel", "pandas", "nbconvert"]

[project.scripts]
qplay = "qplay.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
