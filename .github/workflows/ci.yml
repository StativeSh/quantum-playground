name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: macos-latest
            python-version: "3.15"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Install Chromium for the explorer's browser tests
        if: matrix.python-version == '3.12' && runner.os == 'Linux'
        run: |
          pip install -e ".[browser]"
          python -m playwright install --with-deps chromium
          echo "QPLAY_REQUIRE_BROWSER=1" >> "$GITHUB_ENV"
      - name: Run every test, including the slow ones, with coverage
        run: pytest -rP -m "" --cov=qplay --cov-report=term-missing
      - name: Execute notebooks
        if: matrix.python-version == '3.12' && runner.os == 'Linux'
        run: |
          for f in notebooks/*.ipynb lessons/*.ipynb; do
            jupyter nbconvert --to notebook --execute --stdout "$f" > /dev/null
          done

  # A separate job, so Python 3.10 is also tested with current dependencies in the matrix above.
  oldest-dependencies:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install the lowest versions pyproject.toml allows
        run: pip install -e ".[dev]" numpy==2.0.2 scipy==1.13.1 sympy==1.13.3 matplotlib==3.9.2
      - run: pytest -m ""
