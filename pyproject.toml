[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-playground"
version = "1.0.0rc1"
description = "A physics and maths playground: simulations, symbolic maths and notebooks."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=2.0.2", "scipy>=1.13.1", "sympy>=1.13.3", "matplotlib>=3.9.2"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "jupyterlab", "ipykernel", "pandas", "nbconvert", "markdown2", "pdoc", "build"]
# Browser tests of the explorer (tests/test_explorer.py); also run `python -m playwright install chromium`.
browser = ["playwright"]

[project.urls]
Homepage = "https://stativesh.github.io/quantum-playground/"
Documentation = "https://stativesh.github.io/quantum-playground/api/"
Source = "https://github.com/StativeSh/quantum-playground"

[project.scripts]
qplay = "qplay.__main__:main"

[tool.setuptools.package-data]
qplay = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow tests (site build, big simulations) are skipped by default; `make test-all` or `pytest -m ""` runs them.
addopts = "-q -m 'not slow'"
markers = ["slow: takes more than a couple of seconds; skipped unless selected with -m \"\" or -m slow"]

[tool.coverage.run]
source = ["qplay"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
