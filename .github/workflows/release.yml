name: Release

# Push a tag like v0.3.0 to publish that version to PyPI.
# One-time setup on PyPI: add a "trusted publisher" for this repository with
# workflow file `release.yml` and environment `pypi` (no API token needed).
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Tag must match the package version
        run: |
          version=$(python -c "import qplay; print(qplay.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but qplay.__version__ is $version"; exit 1; }
      - run: pytest -m ""
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/quantum-playground/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
