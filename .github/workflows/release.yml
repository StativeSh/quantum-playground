name: Release

# Push a tag like v0.3.0 to publish that version to PyPI.
# One-time setup on PyPI: add a "trusted publisher" for this repository with
# workflow file `release.yml` and environment `pypi` (no API token needed).
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Tag must match the package version
        run: |
          version=$(python -c "import qplay; print(qplay.__version__)")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but qplay.__version__ is $version"; exit 1; }
      - run: pytest -m ""
      - run: python -m build
      - name: Exercise the built wheel in a clean environment
        run: |
          work=$(mktemp -d)
          python -m venv "$work/venv"
          source "$work/venv/bin/activate"
          pip install dist/*.whl ipykernel nbconvert matplotlib-inline
          cp lessons/01_simple_harmonic_motion.ipynb "$work/"
          cd "$work"
          qplay list
          python -m ipykernel install --sys-prefix --name wheel-smoke
          jupyter nbconvert --to notebook --execute --ExecutePreprocessor.kernel_name=wheel-smoke --stdout 01_simple_harmonic_motion.ipynb > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    if: ${{ !contains(github.ref_name, 'rc') }}
    needs: [build, macos-wheel]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/quantum-playground/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-candidate:
    if: contains(github.ref_name, 'rc')
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  macos-wheel:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install the wheel without compiling native dependencies
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          source "$RUNNER_TEMP/wheel/bin/activate"
          pip install --only-binary=:all: dist/*.whl
          cd "$RUNNER_TEMP"
          qplay --version
          MPLBACKEND=Agg qplay run energy_drift
